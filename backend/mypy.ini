[mypy]
# Gradual typing: keep checks useful without blocking CI until dict-heavy modules are fully narrowed.
python_version = 3.11
strict = False
warn_unused_configs = True
warn_return_any = True
check_untyped_defs = True
no_implicit_optional = True
explicit_package_bases = True
show_error_codes = True
# Pydantic / JSON configs are dict[str, Any]; full narrowing is a follow-up.
disable_error_code = union-attr, index, arg-type, no-any-return

[mypy-dateutil.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-aiosqlite.*]
ignore_missing_imports = True
