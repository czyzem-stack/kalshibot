# pip install pre-commit && pre-commit install
# CI runs the same linters without mutating the tree: ``ruff check backend`` + ``ruff format --check backend``.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/
